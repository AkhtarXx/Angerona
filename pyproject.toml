[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "angerona"
version = "0.1.0"
description = "AI-powered binary security workspace for defensive reverse engineering with IDA Pro or Ghidra."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "pyaxmlparser>=0.3.31,<0.4", "numpy>=1.26,<3", "networkx>=3,<4"]
license = { file = "LICENSE" }
authors = [{ name = "Angerona contributors" }]
keywords = [
    "reverse-engineering",
    "binary-analysis",
    "security",
    "ida-pro",
    "ghidra",
    "mcp",
    "defensive-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/AkhtarXx/Angerona"
Repository = "https://github.com/AkhtarXx/Angerona"
Issues = "https://github.com/AkhtarXx/Angerona/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "PyNaCl>=1.5,<2", "pytest-timeout>=2,<3", "pytest-xdist>=3.6,<4"]
signing = ["PyNaCl>=1.5,<2"]
emulation = ["unicorn>=2.1,<3"]
symbols = ["pyelftools>=0.31,<1"]
rules = ["yara-python>=4.5,<5"]
lifting = ["pypcode>=4", "pyvex>=9.2", "capstone>=5", "bitstring>=4.4,<5"]
symbolic = ["angr>=9.2,<10", "bitstring>=4.4,<5"]

[project.scripts]
angerona = "src.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.web" = ["index.html", "static/app.css", "static/app.js"]
"src.analysis" = ["signatures.yaml", "resources/*.Dockerfile", "resources/*.java"]
"src.scripts" = ["*.java"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "angr: tests requiring the optional angr symbolic-execution dependency",
    "android_e2e: real official Android Emulator/KVM/Frida integration tests",
]
