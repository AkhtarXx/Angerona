name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: dev,emulation,symbols
          - python-version: "3.12"
            extras: dev,emulation,symbols,lifting,symbolic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y gcc clang llvm lld bubblewrap gdb qemu-user
      - name: Prepare cgroup delegation and Docker sandbox
        run: |
          sudo loginctl enable-linger root
          sudo systemctl start user@0.service
          sudo test -S /run/user/0/bus
          docker build -t gra-detonate:latest -f src/analysis/resources/detonate.Dockerfile .
      - name: Create checkout-local environment and source fixture
        env:
          TEST_EXTRAS: ${{ matrix.extras }}
        run: |
          python -m venv --copies .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[${TEST_EXTRAS}]" frida-tools
          gcc -O0 -g -fno-builtin -fno-stack-protector -no-pie samples/crackme.c -o samples/crackme
      - name: Test backend with managed-runner privileges
        run: |
          test_python="$PWD/.venv/bin/python"
          sudo -E env XDG_RUNTIME_DIR=/run/user/0 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/0/bus "$test_python" -m pytest tests -n4 --dist=loadfile --timeout=180 --timeout-method=signal --junitxml=backend.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-${{ matrix.python-version }}
          path: backend.xml

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python scripts/prepare_review.py --check
      - run: python -m build --wheel
      - run: python -m venv /tmp/angerona-wheel-test
      - run: /tmp/angerona-wheel-test/bin/pip install dist/*.whl
      - run: /tmp/angerona-wheel-test/bin/angerona analyze-any /bin/true --json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: frontend-browser-failures
          path: frontend/test-results
